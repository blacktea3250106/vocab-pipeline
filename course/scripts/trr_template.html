  FOCUS = (FOCUS + d + box.children.length) % box.children.length;
  paintFocus();
}
/* The primary action of whatever screen is showing — the green button in the
   footer. Lets ⏎ drive every step, not just the quiz. */
function primary() {
  const b = footInner.querySelector('.btn:not(.ghost)');
  if (b && !b.disabled) { b.click(); return true; }
  return false;
}

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;   // typing
  const box = document.getElementById('opts');
  const inQuiz = !!box && box.children.length > 0;

  // dictation: number keys place tiles, backspace takes the last one back,
  // R replays the audio, ⏎ checks
  const bank = document.getElementById('bank');
  if (bank && DICT && !ANSWERED) {
    if (e.key === 'Backspace') { e.preventDefault(); DSEL.pop(); return dictPaint(DICT); }
    if (e.key.toLowerCase() === 'r') { e.preventDefault(); return dictPlay(DICT); }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= bank.children.length) {
      e.preventDefault();
      if (DSEL.indexOf(n - 1) < 0) { DSEL.push(n - 1); dictPaint(DICT); }
      return;
    }
    if (e.key === 'Enter' && DSEL.length) { e.preventDefault(); return dictCheck(DICT); }
    return;
  }

  if (inQuiz && !ANSWERED) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); return moveFocus(1); }
    if (e.key === 'ArrowUp') { e.preventDefault(); return moveFocus(-1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); return goPrev(); }
    const n = '1234'.indexOf(e.key);
    const l = 'abcd'.indexOf(e.key.toLowerCase());
    const i = n >= 0 ? n : l;
    if (i >= 0 && i < box.children.length) { e.preventDefault(); return pick(i); }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); return pick(FOCUS); }
    return;
  }
  if (e.key === 'ArrowLeft' && typeof goPrev === 'function' && document.getElementById('opts')) {
    e.preventDefault(); return goPrev();
  }
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') {
    if (NEXT) { e.preventDefault(); const f = NEXT; NEXT = null; return f(); }
    if (primary()) e.preventDefault();
  }
});
function pick(i) {
  if (PICKS[QN] !== undefined) return;          // already answered this sitting
  const q = Qs[QN], ans = q.correct !== undefined ? q.correct : q.ans;
  const ok = i === ans;
  if (ok) QRight++;
  PICKS[QN] = i; OKS[QN] = ok;
  RTS[QN] = QT0 ? Date.now() - QT0 : 0;
  // _kind is carried by items pulled from the mistake log, where one sitting can
  // mix drill and sem questions — filing them all under the set's kind would
  // credit sem answers to the drill accuracy on the home screen.
  const kind = q._kind || (QK === 'trr' && q.type === 'vocab' ? 'vocab' : QK);
  // In "all units" mode U is null, so recover the unit from the chunk id
  // (01-10 → A, 11-20 → B, …) instead of filing every answer under 'T'.
  const uid = (U && U.id) ||
    (q.cid && D.units[Math.floor((+q.cid - 1) / 10)] || {}).id || 'T';
  logAnswer(kind, ok, {unit: uid, cid: q.cid, qid: q.qid, rt: RTS[QN],
                       srsKey: q.srsKey, srsKind: q.srsKind});
  markResume();
  showAnswered(q, i);
  // Long explanations push the review below the fold; bring it into view so the
  // answer is never something you have to go looking for.
  const whyEl = document.querySelector('.why') || document.querySelector('.field');
  if (whyEl) whyEl.scrollIntoView({block: 'nearest', behavior: 'smooth'});
}

/* Paint a question in its answered state. Shared by "just answered" and
   "stepped back to" so a revisit looks identical but scores nothing twice. */
function showAnswered(q, i) {
  const ans = q.correct !== undefined ? q.correct : q.ans;
  const ok = i === ans;
  [...document.getElementById('opts').children].forEach((b, j) => {
    b.disabled = true;
    b.classList.remove('ok', 'no');
    if (j === ans) b.classList.add('ok');
    else if (j === i) b.classList.add('no');
  });
  const typeLabel = q.type ? q.type.replace('_',' ') : '';
  if (typeLabel) {
    document.getElementById('qt').innerHTML = '<span class="qtype">' + esc(typeLabel) + '</span>';
  }
  let w = '';
  if (q.why || q.grammar) {
    w = '<div class="why"><b>' + (ok ? 'Correct' : 'Why ' + KEYS[ans]) + '</b>' + esc(q.why || '') +
        (q.grammar ? '<span class="gr">' + esc(q.grammar) + '</span>' : '') + '</div>';
  }
  if (q.field) {
    w += '<div class="field" style="margin:14px 0 0">' + esc(q.field) + '</div>';
  }
  document.getElementById('why').innerHTML = w;
  ANSWERED = true; paintFocus();
  NEXT = () => { QN++; renderQ(); };
  const done = PICKS.filter(x => x !== undefined).length;
  const rt = RTS[QN] ? '<span class="rt' + (RTS[QN] > 20000 ? ' slow' : '') + '">' +
             secs(RTS[QN]) + '</span>' : '';
  setFoot(prevBtn() +
          '<span class="info">' + QRight + ' / ' + done + rt +
            '<span class="kbd"> · ⏎ next</span></span><div style="flex:1"></div>' +
          (q.audio ? '<button class="snd" onclick="play(\'' + q.audio + '\')">🔊</button>' : '') +
          '<button class="btn" onclick="NEXT=null;QN++;renderQ()">' +
            (QN+1 >= Qs.length ? 'Finish →' : 'Next →') + '</button>');
}

/* ── dictation: hear the chunk, rebuild it from word tiles ─────────────────
   Tiles rather than a text field — production recall that still works one-handed
   on a phone, which typing the chunk did not. The sentence is withheld until the
   answer is locked in: showing it alongside the audio is what turned the old
   Listen quiz into reading with a soundtrack. */
let DSEL = [], DPLAYS = 0, DGAVEUP = false;

function renderDict() {
  const d = Qs[QN];
  setPhase('DICTATION','dict'); window.scrollTo(0,0);
  DSEL = []; DPLAYS = 0; DGAVEUP = false;

  app.innerHTML = '<div class="card">' +
    '<div class="qnum">' + (QN+1) + ' / ' + Qs.length + '<span class="qtype">listen · build</span></div>' +
    '<div class="playwrap">' +
      '<button class="playbtn" id="pb">▶</button>' +
      '<div class="playmeta" id="pm">tap to replay the chunk</div>' +
    '</div>' +
    '<div class="slots" id="slots"></div>' +
    '<div class="bank" id="bank"></div>' +
    '<div id="rev"></div>' +
  '</div>' +
  '<div style="text-align:center"><button class="giveup" id="gu">Can\'t catch it — show me the answer</button></div>';

  document.getElementById('pb').onclick = () => dictPlay(d);
  document.getElementById('gu').onclick = () => { DGAVEUP = true; dictCheck(d); };
  d.tiles.forEach((w, i) => {
    const b = document.createElement('button');
    b.className = 'wt'; b.textContent = w; b.dataset.i = i;
    b.innerHTML = '<span class="tk">' + (i + 1) + '</span>' + esc(w);
    b.onclick = () => { DSEL.push(i); dictPaint(d); };
    document.getElementById('bank').appendChild(b);
  });
  ANSWERED = false; NEXT = null; DICT = d;   // hand the keyboard this screen
  QT0 = Date.now();
  if (PICKS[QN] !== undefined) {            // revisit: restore the tiles, show the answer
    DSEL = PICKS[QN].slice(); dictPaint(d); DICT = null; dictCheck(d); return;
  }
  dictPaint(d);
  app.focus({preventScroll: true});
  dictPlay(d);          // blind first pass starts immediately, no extra tap
}
let DICT = null;

function dictPlay(d) {
  DPLAYS++;
  play(d.audio);
  const pb = document.getElementById('pb'), pm = document.getElementById('pm');
  if (!pb) return;
  pb.classList.add('on');
  setTimeout(() => pb.classList.remove('on'), 1400);
  pm.textContent = DPLAYS === 1 ? 'first play' : DPLAYS + ' plays';
}

function dictPaint(d) {
  const slots = document.getElementById('slots'), bank = document.getElementById('bank');
  slots.className = 'slots' + (DSEL.length ? ' filled' : '');
  slots.innerHTML = DSEL.length
    ? DSEL.map((i, pos) => '<button class="wt placed" data-pos="' + pos + '">' + esc(d.tiles[i]) + '</button>').join('')
    : '<span class="ph">tap the words to build the chunk — base form, as you learned it</span>';
  slots.querySelectorAll('.wt').forEach(b => {
    b.onclick = () => { DSEL.splice(+b.dataset.pos, 1); dictPaint(d); };
  });
  [...bank.children].forEach((b, i) => b.classList.toggle('spent', DSEL.indexOf(i) >= 0));
  setFoot(prevBtn() + '<span class="info">' + QRight + ' / ' + QN +
            '<span class="kbd"> · 1-9 place · ⌫ undo · R replay · ⏎ check</span></span>' +
          '<div style="flex:1"></div>' +
          '<button class="btn" id="sub"' + (DSEL.length ? '' : ' disabled') + '>Check →</button>');
  const sub = document.getElementById('sub');
  if (sub) sub.onclick = () => dictCheck(d);
}

function dictCheck(d) {
  const norm = a => a.map(w => w.toLowerCase().replace(/[’]/g, "'")).join(' ');
  const ok = !DGAVEUP && norm(DSEL.map(i => d.tiles[i])) === norm(d.answer);
  // Score exactly once. Stepping back re-renders this same view, so the guard
  // has to sit on the scoring, not on the whole function — the reveal still
  // needs to be painted on a revisit.
  if (PICKS[QN] === undefined) {
    if (ok) QRight++;
    PICKS[QN] = DSEL.slice(); OKS[QN] = ok;
    RTS[QN] = QT0 ? Date.now() - QT0 : 0;
    logAnswer('dict', ok, {unit: d.unit || (U ? U.id : '-'), cid: d.cid,
                           plays: DPLAYS, gaveUp: DGAVEUP, rt: RTS[QN]});
    markResume();
  }

  const slots = document.getElementById('slots');
  if (DSEL.length) slots.classList.add(ok ? 'ok' : 'no');
  slots.querySelectorAll('.wt').forEach(b => { b.onclick = null; b.disabled = true; });
  document.getElementById('bank').innerHTML = '';
  document.getElementById('gu').style.display = 'none';
  document.getElementById('pm').textContent =
    DPLAYS + (DPLAYS === 1 ? ' play' : ' plays') + (ok && DPLAYS === 1 ? ' · first try' : '');

  document.getElementById('rev').innerHTML = '<div class="reveal">' +
    (ok ? '' : '<div class="why" style="margin:0 0 12px"><b>Answer</b>' + esc(d.answer.join(' ')) +
               ' — ' + esc(d.zh) + '</div>') +
    '<div class="sent">' + d.sent +
      (d.exAudio ? ' <button class="snd" style="vertical-align:middle" onclick="play(\'' +
        d.exAudio + '\')">🔊</button>' : '') + '</div>' +
    (d.exZh ? '<div class="zh">' + esc(d.exZh) + '</div>' : '') +
    (d.grammar ? '<span class="gr">' + esc(d.grammar) + '</span>' : '') +
  '</div>';

  ANSWERED = true; DICT = null;
  NEXT = () => { QN++; renderQ(); };
  setFoot(prevBtn() + '<span class="info">' + QRight + ' / ' + (QN+1) +
            (RTS[QN] ? '<span class="rt">' + secs(RTS[QN]) + '</span>' : '') +
            '<span class="kbd"> · ⏎ next</span></span><div style="flex:1"></div>' +
          '<button class="snd" onclick="play(\'' + d.chunkAudio + '\')">🔊</button>' +
          '<button class="btn" onclick="NEXT=null;QN++;renderQ()">' +
          (QN+1 >= Qs.length ? 'Finish →' : 'Next →') + '</button>');
}

/* ── dictation intro ─────────────────────────────────────── */
function dictIntro() {
  setPhase('DICTATION','dict'); setBar(.3); window.scrollTo(0,0);
  app.innerHTML = '<h2 class="sec">Unit ' + U.id + ' · Chunk Dictation</h2>' +
    '<div class="card"><p style="margin:0;font-size:14px;line-height:1.75">' +
      'All <b>' + U.dictation.length + ' chunks</b> from this unit, one example sentence each. ' +
      'It plays once on its own — rebuild the chunk from the tiles before you look at anything. ' +
      'Replays are free but they are counted, because <b>heard-it-first-play</b> is the number ' +
      'that tracks your decoding.</p></div>';
  setFoot('<div style="flex:1"></div><button class="btn" onclick="runQuiz(U.dictation,\'dict\',afterDict,resumeAt(\'dict\',U.id))">Start →</button>');
}
function afterDict(right, total) {
  S.units[U.id].dict = {right, total}; save(S);
  const next = ENTRY === 'dict' ? () => typeScreen('dict') : unitDone;
  summary('dict', next);
}

/* ── chunk drill ─────────────────────────────────────────── */
function drillIntro() {
  setPhase('CHUNK DRILL','drill'); setBar(.55); window.scrollTo(0,0);
  app.innerHTML = '<h2 class="sec">Unit ' + U.id + ' · Chunk Drill</h2>' +
    '<div class="card"><p style="margin:0 0 14px;font-size:14px;line-height:1.7">' +
      'All <b>' + U.chunkList.length + ' chunks</b> from this unit, <b>' + U.drill.length + ' questions</b>. ' +
      'Distractors are same-root or near-synonym forms — recognising the meaning will not be enough.</p>' +
      '<div class="rows">' + U.chunkList.map(c =>
        '<div class="r"><b>' + esc(c.chunk) + '</b><small>' + esc(c.zh) + '</small>' +
        '<span class="n"><button class="snd" onclick="play(\'' + c.audio + '\')">🔊</button></span></div>').join('') +
      '</div></div>';
  setFoot('<div style="flex:1"></div><button class="btn" onclick="runQuiz(U.drill,\'drill\',afterDrill,resumeAt(\'drill\',U.id))">Start drill →</button>');
}
function afterDrill(right, total) {
  S.units[U.id].drill = {right, total}; save(S);
  const next = ENTRY === 'drill' ? () => typeScreen('drill') : dictIntro;
  summary('drill', next);
}

/* ── semantic drill ──────────────────────────────────────── */
function semIntro() {
  setPhase('VOCABULARY','sem'); setBar(.78); window.scrollTo(0,0);
  if (!U.fields.length) return readingScreen();
  const items = [];
  U.fields.forEach(f => f.qs.forEach(q => items.push({...q, field: f.title + '\n' +
    f.members.map(m => '  · ' + m).join('\n')})));
  // Field contents stay behind a fold: listing them here would hand over the
  // answer set moments before the questions. Retrieval first, the map after —
  // each field is revealed once its question has been answered.
  app.innerHTML = '<h2 class="sec">Unit ' + U.id + ' · Vocabulary</h2>' +
    '<div class="card"><p style="margin:0 0 14px;font-size:14px;line-height:1.7">' +
      '<b>' + U.fields.length + ' fields · ' + items.length + ' questions.</b> ' +
      'Every distractor comes from the same field, so all four options are correct English. ' +
      'No Chinese appears — decide from the situation alone. Each field map is revealed ' +
      'after you answer.</p>' +
      '<details><summary style="cursor:pointer;font-size:13px;color:var(--ink-soft)">' +
        'Preview the field maps first (easier, but you lose the retrieval effect)</summary>' +
        U.fields.map(f => '<div class="field" style="margin-top:12px">' + esc(f.title) + '\n' +
          f.members.map(m => '  · ' + m).join('\n') + '</div>').join('') +
      '</details>' +
    '</div>';
  setFoot('<div style="flex:1"></div><button class="btn" onclick=\'runQuiz(' +
          JSON.stringify(items).replace(/'/g,"&#39;") + ',"sem",afterSem,resumeAt("sem",U.id))\'>Start →</button>');
}
function afterSem(right, total) {
  S.units[U.id].sem = {right, total}; save(S);
  const next = ENTRY === 'sem' ? () => typeScreen('sem') : drillIntro;
  summary('sem', next);
}

function unitDone() {
  setPhase('UNIT DONE','home'); setBar(1); window.scrollTo(0,0);
  const st = S.units[U.id];
  // Done only when every step has actually been run — jumping straight into one
  // drill must not mark the whole unit complete.
  st.done = !!(st.read && st.dict && st.drill && st.sem); save(S);
  const pc = o => o ? Math.round(100*o.right/o.total) + '%' : '—';
  app.innerHTML = '<div class="card wpmcard"><b>' + (st.read ? st.read.wpm : '—') + '</b>' +
      '<span>wpm on this text</span><div class="cmp">Unit ' + U.id + ' complete</div></div>' +
    '<div class="rows">' +
      '<div class="r">Vocabulary<span class="n">' + pc(st.sem) + '</span></div>' +
      '<div class="r">Chunk drill<span class="n">' + pc(st.drill) + '</span></div>' +
      (avgRT() ? '<div class="r">Average time per question<span class="n">' + secs(avgRT()) + '</span></div>' : '') +
      '<div class="r">Reading <small>&nbsp;· ' + U.format + '</small><span class="n">' +
        (st.read ? st.read.wpm + ' wpm' : '—') + '</span></div>' +
      '<div class="r">Dictation<span class="n">' + pc(st.dict) + '</span></div>' +
    '</div>' +
    '<p style="font-size:13px;color:var(--ink-soft);margin-top:20px;line-height:1.7">' +
      'These texts share their vocabulary with each other. The Transfer Test has lower overlap — ' +
      'that is the number that tells you whether any of this is transferring.</p>';
  setFoot('<button class="btn ghost" onclick="home()">Home</button><div style="flex:1"></div>' +
          '<button class="btn" onclick="startTransfer()">Transfer Test →</button>');
}

/* ── story listening ───────────────────────────────────────
   The reading pass and this share one question bank on purpose: answering the
   same items by eye and by ear is the only way to see which of the two is
   actually the bottleneck. The transcript is withheld until the answers are in,
   because the old page showed text and audio together — which quietly turned
   every listening question into a reading question. */
function bossScreen() {
  setPhase('STORY LISTENING','home'); setBar(0); setFoot(null);
  exitBtn.style.display = ''; stopAudio(); window.scrollTo(0,0);

  let h = '<button class="back" onclick="home()">← All practice</button>' +
    '<div class="hero" style="padding-top:6px"><h1>🐲 Story Listening</h1>' +
    '<p>Audio only — no transcript until you have answered. One or two plays, then commit, ' +
    'the way Part 3 and Part 4 actually run.</p></div><div class="ulist">';
  D.units.forEach((u, i) => {
    const st = S.units[u.id] || {}, b = st.boss;
    h += '<button class="' + (b ? 'ok' : '') + '" onclick="bossPlay(' + i + ')">' +
      '<span class="u">STORY ' + u.id + '</span>' +
      '<span class="t">' + u.icon + ' ' + esc(u.title) +
        '<span class="fmt">' + u.format + '</span></span>' +
      '<span class="q">' + u.boss.qs.length + ' Q' +
        (b ? ' · ' + Math.round(100*b.right/b.total) + '%' : '') + '</span>' +
      '<span class="go">→</span></button>';
  });
  h += '</div>';

  // Reading and listening on the same items — the gap between the two columns
  // is the number worth watching.
  const rows = D.units.filter(u => (S.units[u.id]||{}).boss || (S.units[u.id]||{}).readq);
  if (rows.length) {
    const pc = o => o ? Math.round(100*o.right/o.total) + '%' : '—';
    h += '<h2 class="sec">By ear vs. by eye</h2><div class="rows">' +
      rows.map(u => '<div class="r">Story ' + u.id + '<small>&nbsp;· ' + esc(u.title) + '</small>' +
        '<span class="n">' + pc((S.units[u.id]||{}).boss) + ' / ' +
        pc((S.units[u.id]||{}).readq) + '</span></div>').join('') +
      '</div><p style="font-size:12.5px;color:var(--ink-soft);margin-top:14px;line-height:1.7">' +
      'Listening % / reading %. A wide gap means the words are known and the ear is the bottleneck — ' +
      'that is a decoding problem, and Chunk Dictation is where it gets fixed.</p>';
  }
  app.innerHTML = h;
}

let BOSSI = 0, BPLAYS = 0;
function bossPlay(i) {
  BOSSI = i; U = D.units[i]; BPLAYS = 0;
  S.units[U.id] = S.units[U.id] || {};
  setPhase('STORY ' + U.id + ' · LISTEN','dict'); setBar(.4);
  exitBtn.style.display = ''; window.scrollTo(0,0);

  app.innerHTML = '<h2 class="sec">Story ' + U.id + ' · ' + U.format + '</h2>' +
    '<div class="card">' +
      '<div class="playwrap">' +
        '<button class="playbtn" id="pb">▶</button>' +
        '<div class="playmeta" id="pm">not played yet</div>' +
      '</div>' +
      '<p style="margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.75;text-align:center">' +
        'The title is deliberately not shown. Listen, then answer from memory — ' +
        'the transcript appears once the questions are done.</p>' +
    '</div>';
  document.getElementById('pb').onclick = () => bossListen();
  setFoot('<button class="btn ghost" onclick="bossScreen()">Back</button><div style="flex:1"></div>' +
          '<button class="btn" onclick="bossAsk()">Questions →</button>');
}
function bossListen() {
  BPLAYS++;
  const pb = document.getElementById('pb'), pm = document.getElementById('pm');
  pb.classList.add('on');
  pm.textContent = 'playing… (' + BPLAYS + (BPLAYS === 1 ? ' play)' : ' plays)');
  playSeq(U.boss.audio, () => {
    if (!pb.isConnected) return;
    pb.classList.remove('on');
    pm.textContent = BPLAYS + (BPLAYS === 1 ? ' play' : ' plays');
  });
}
function bossAsk() {
  stopAudio();
  runQuiz(U.boss.qs, 'boss', (right, total) => {
    S.units[U.id].boss = {right, total, plays: BPLAYS}; save(S);
    bossDone(right, total);
  });
}
function bossDone(right, total) {
  setPhase('STORY ' + U.id + ' DONE','home'); setBar(1); window.scrollTo(0,0);
  const pc = Math.round(100*right/total);
  const rq = S.units[U.id].readq;
  app.innerHTML = '<div class="card wpmcard"><b>' + pc + '%</b><span>by ear</span>' +
      '<div class="cmp">' + right + ' / ' + total + ' correct · ' + BPLAYS +
      (BPLAYS === 1 ? ' play' : ' plays') +
      (rq ? '<br>same story by eye: ' + Math.round(100*rq.right/rq.total) + '%' : '') + '</div></div>' +
    '<h2 class="sec">Transcript · ' + esc(U.title) + '</h2>' +
    '<div class="card"><div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:12px">' +
      'Green = a chunk you have learned. Tap it to hear it again — the ones you missed by ear are ' +
      'the ones to look at.</div>' +
    passageHTML(U.cued, 'chunk') + '</div>';
  app.querySelectorAll('.ck').forEach(el => {
    el.onclick = () => {
      const t = el.textContent.trim().toLowerCase();
      const c = U.chunkList.find(c => c.chunk.toLowerCase() === t) ||
                U.chunkList.find(c => t.indexOf(c.chunk.toLowerCase()) >= 0);
      if (c) play(c.audio);
    };
  });
  setFoot('<button class="btn ghost" onclick="bossScreen()">Stories</button><div style="flex:1"></div>' +
          (BOSSI < D.units.length - 1
            ? '<button class="btn" onclick="bossPlay(' + (BOSSI+1) + ')">Next story →</button>'
            : '<button class="btn" onclick="home()">Home</button>'));
}

/* ── transfer test ───────────────────────────────────────── */
function startTransfer() {
  U = null; exitBtn.style.display = '';
  setPhase('TRANSFER · TIMED','read'); setBar(.5); window.scrollTo(0,0);
  const T = D.transfer, goalMs = T.words / GOAL_TRANSFER * 60000;
  app.innerHTML = '<h2 class="sec">Transfer Test · one pass, no re-reading</h2>' +
    '<div class="timer"><span class="t" id="tt">0:00</span><div class="track"><i id="tk"></i></div>' +
      '<span class="goal">goal ' + GOAL_TRANSFER + ' wpm · ' + fmt(goalMs) + '</span></div>' +
    '<div class="card"><div class="passage plain" style="font-size:16px;line-height:1.9">' +
      T.paras.map(p => '<p>' + p + '</p>').join('') + '</div></div>';
  setFoot('<span class="info">' + T.words + ' words</span><div style="flex:1"></div>' +
          '<button class="btn" onclick="stopTransfer()">Done reading →</button>');
  t0 = Date.now();
  const tt = document.getElementById('tt'), tk = document.getElementById('tk');
  timer = setInterval(() => {
    const el = Date.now() - t0; tt.textContent = fmt(el);
    const r = el / goalMs; tk.style.width = Math.min(100, r*100) + '%';
    if (r > 1) { tk.classList.add('over'); tt.classList.add('over'); }
  }, 200);
}
function stopTransfer() {
  clearInterval(timer); timer = null;
  const T = D.transfer, ms = Date.now() - t0, w = wpmOf(T.words, ms);
  if (!tooFast(ms)) { S.transfer = {wpm: w, ms}; save(S); }
  window.scrollTo(0,0);
  app.innerHTML = '<div class="card wpmcard"><b>' + w + '</b><span>transfer wpm</span>' +
    '<div class="cmp">' + fmt(ms) + ' · this text was new to you</div></div>';
  setFoot('<div style="flex:1"></div><button class="btn" onclick=\'runQuiz(' +
    JSON.stringify(T.qs).replace(/'/g,'&#39;') + ',"transfer",afterTransfer)\'>Questions →</button>');
}
function afterTransfer(right, total) {
  const pc = Math.round(100*right/total);
  S.transfer.comp = pc; S.transfer.right = right; S.transfer.total = total;
  save(S);
  setPhase('RESULT','home'); setBar(1); window.scrollTo(0,0);
  const valid = pc >= 70;
  app.innerHTML = '<div class="card wpmcard"><b>' + S.transfer.wpm + '</b><span>transfer wpm</span>' +
      '<div class="cmp">' + right + ' / ' + total + ' correct · ' + pc + '%</div></div>' +
    '<div class="rows">' +
      '<div class="r">Comprehension gate <small>&nbsp;· ≥70% required</small><span class="n' +
        (valid ? '' : ' bad') + '">' + pc + '%</span></div>' +
      '<div class="r">Counts toward your baseline<span class="n' + (valid ? '' : ' bad') + '">' +
        (valid ? 'Yes' : 'No') + '</span></div>' +
    '</div>' +
    '<p style="font-size:13px;color:var(--ink-soft);margin-top:20px;line-height:1.75">' +
      (valid
        ? 'This is your baseline. From tomorrow the target becomes <b>' +
          Math.round(S.transfer.wpm*1.1) + ' wpm</b> — your baseline +10%.'
        : 'Speed without comprehension does not count. Slow down on the next run until you clear 70%, then push the pace again.') +
    '</p>';
  setFoot('<button class="btn ghost" onclick="home()">Home</button>');
}

boot();
</script>
</body>
</html>
